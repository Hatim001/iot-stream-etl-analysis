name: Build and Deploy Dashboard

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"

      - name: Install dependencies
        run: bun install

      - name: Change directory to dashboard
        run: cd dashboard

      - name: Build Next.js app
        run: bun run build
        env:
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_CLIENT_SECRET: ${{ secrets.COGNITO_CLIENT_SECRET }}
          COGNITO_ISSUER: ${{ secrets.COGNITO_ISSUER }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          BASE_API_URL: ${{ secrets.BASE_API_URL }}

      - name: Sync build to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 sync .next/static s3://$AWS_S3_BUCKET/_next/static --region $AWS_REGION --delete
          aws s3 sync .next/server s3://$AWS_S3_BUCKET/_next/server --region $AWS_REGION --delete
          aws s3 sync public/ s3://$AWS_S3_BUCKET/ --region $AWS_REGION --delete
